name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    # The store and API layers talk to a real database; there is nothing to
    # mock and a mocked one would not have caught a single SQL mistake.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: iofi
          POSTGRES_PASSWORD: iofi
          POSTGRES_DB: iofi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iofi"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IOFI_TEST_DATABASE_URL: postgres://iofi:iofi@localhost:5432/iofi?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: mkdir -p web/dist && touch web/dist/index.html
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
